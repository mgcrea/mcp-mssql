[project]
name = "mcp-mssql"
version = "0.1.0"
license = "MIT"
description = "MCP tool server — SQL Server access for AI agents"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "uvicorn>=0.32.0",
    "starlette>=0.41.0",
    "pymssql>=2.3.0",
    "structlog>=24.0.0",
    # Real T-SQL parsing for the table allow-list. A regex cannot do this job — see the
    # module docstring in src/mcp_mssql/table_extraction.py.
    "sqlglot>=30.14.0",
    "mcp-guard>=0.1",
]

# TODO(deploy): mcp-guard is not published yet, so it resolves from a sibling checkout.
# This works for local development and tests but NOT for the Docker build, whose context is
# this directory alone — the image cannot see ../mcp-guard. Before the next image build,
# publish mcp-guard and replace this block with a plain version requirement or a
# `{ git = "...", tag = "v0.1.0" }` source.
[tool.uv.sources]
mcp-guard = { path = "../mcp-guard", editable = true }

[project.scripts]
mcp-mssql = "mcp_mssql.server:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_mssql"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "W", "I"]
