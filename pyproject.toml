[project]
name = "mcp-mssql"
version = "0.1.0"
description = "MCP tool server — read-only SQL Server access for AI agents"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "uvicorn>=0.32.0",
    "starlette>=0.41.0",
    "pymssql>=2.3.0",
    "structlog>=24.0.0",
]

[project.scripts]
mcp-mssql = "server:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
sources = {"src" = ""}

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "W", "I"]
