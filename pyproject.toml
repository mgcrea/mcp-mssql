[project]
name = "mcp-mssql"
version = "0.1.0"
license = "MIT"
description = "MCP tool server — SQL Server access for AI agents"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.1.0",
    "uvicorn>=0.52.4",
    "starlette>=1.6.0",
    "pymssql>=2.3.13",
    "structlog>=26.1.0",
    # Real T-SQL parsing for the table allow-list. A regex cannot do this job — see the
    # module docstring in src/mcp_mssql/table_extraction.py.
    "sqlglot>=30.17.0",
    # Per-caller authentication and authorization. Resolved from PyPI, deliberately: a
    # `[tool.uv.sources]` path to a sibling checkout works locally but not in the Docker
    # build, whose context is this directory alone.
    #
    # >=0.5 is a floor, not a preference. Before it, `MCP_REQUIRE_AUTH` refused the MCP
    # discovery handshake as well as tool calls — and an agent runtime enumerates this
    # server's tools at startup, when it holds no caller token and never will. The 401 made
    # the runtime drop this server for the life of its process, so the tool did not appear
    # to say no; it appeared not to exist.
    # >=0.6.0 for row predicates: the tool reads `Decision.filters` and rewrites the query
    # around them. An older guard does not populate that field, so the predicate would be
    # silently dropped and every row returned — which is why this floor is not merely a
    # convenience. The backend enforces the same floor from its side, refusing to send
    # predicates to a guard below it.
    "mcp-policy-guard>=0.6.0",
]

[project.scripts]
mcp-mssql = "mcp_mssql.server:main"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_mssql"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "W", "I"]
